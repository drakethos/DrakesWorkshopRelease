# Posts a Discord embed when a GitHub Release is published.
# Requires repo secret WEBHOOK_URL (Discord webhook URL).
name: GitHub Releases to Discord

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_name:
        description: Release title to post (manual test)
        required: true
      release_body:
        description: Release notes body to post (manual test)
        required: true
      release_html_url:
        description: Release URL to link in Discord (manual test)
        required: false

permissions:
  contents: read

jobs:
  github-releases-to-discord:
    name: Notify Discord
    runs-on: ubuntu-latest
    steps:
      - name: GitHub Releases to Discord
        uses: SethCohen/github-releases-to-discord@v1.20.0
        with:
          webhook_url: ${{ secrets.WEBHOOK_URL }}
          color: "2105893"
          username: "Drake's Workshop"
          # Role pings need <@&id>. <@id> on a role snowflake renders as @Unknown User.
          content: "<@&1214350479509823588> Build is ready. <@215235028488159232> get your ass to work"
          footer_title: "Changelog"
          footer_timestamp: true
          reduce_headings: true
          release_name: ${{ inputs.release_name }}
          release_body: ${{ inputs.release_body }}
          release_html_url: ${{ inputs.release_html_url }}
