# Ensures every public GitHub Release ships Full Setup + slim Velopack and documents the DWK- gate.
# No source code belongs in this repository — binaries are Release assets only.
name: Verify release assets

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to verify (e.g. v0.1.0). Empty = latest release.
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Full Setup + slim Velopack + license notes
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-}"
          if [ -z "$TAG" ]; then TAG="${EVENT_TAG:-}"; fi
          if [ -z "$TAG" ]; then
            TAG=$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Verifying $TAG"

      - name: Require Full Setup + slim feed + DWK license notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          VER="${TAG#v}"
          MSI="DrakesWorkshop-${VER}-Full-Setup.msi"
          FULL_EXE="DrakesWorkshop-${VER}-Full-Setup.exe"

          mapfile -t ASSETS < <(gh api "repos/${REPO}/releases/tags/${TAG}" --jq '.assets[].name')
          printf 'Assets:\n'
          printf '  %s\n' "${ASSETS[@]}"

          has_msi=0
          has_full_exe=0
          has_slim_setup=0
          has_nupkg=0
          has_releases_json=0
          for a in "${ASSETS[@]}"; do
            [ "$a" = "$MSI" ] && has_msi=1
            [ "$a" = "$FULL_EXE" ] && has_full_exe=1
            [[ "$a" == *Setup.exe && "$a" != *Full-Setup.exe ]] && has_slim_setup=1
            [[ "$a" == *.nupkg && "$a" == *-win* ]] && has_nupkg=1
            [ "$a" = "releases.win.json" ] && has_releases_json=1
          done

          if [ "$has_msi" -ne 1 ] && [ "$has_full_exe" -ne 1 ]; then
            echo "::error::Missing Full Setup installer (need $MSI and/or $FULL_EXE)"
            exit 1
          fi
          if [ "$has_slim_setup" -ne 1 ]; then
            echo "::error::Missing slim Velopack Setup.exe"
            exit 1
          fi
          if [ "$has_nupkg" -ne 1 ]; then
            echo "::error::Missing slim channel nupkg (*-win*.nupkg)"
            exit 1
          fi
          if [ "$has_releases_json" -ne 1 ]; then
            echo "::error::Missing releases.win.json"
            exit 1
          fi

          BODY=$(gh api "repos/${REPO}/releases/tags/${TAG}" --jq .body)
          echo "$BODY" | grep -qi 'DWK-' || {
            echo "::error::Release notes must mention DWK- license keys"
            exit 1
          }
          echo "$BODY" | grep -qi 'license' || {
            echo "::error::Release notes must mention the license gate"
            exit 1
          }

          echo "OK — Full Setup + slim Velopack present; license gate documented."
